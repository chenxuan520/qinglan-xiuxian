name: Runtime observer

on:
  schedule:
    # 北京时间每天中午12:00。
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      reanalyze:
        description: '重分析当前候选异常，不重复提醒或清除去重历史'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: runtime-observer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Restore deduplication and compatible history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/observer/observer.ts --restore artifacts/observer
      - name: Install isolated Pi classifier runtime
        run: npm install --prefix "$RUNNER_TEMP/observer-pi" --registry=https://registry.npmjs.org --no-audit --no-fund --ignore-scripts @earendil-works/pi-coding-agent@1.5.0
      - name: Observe existing reports and aggregate telemetry
        id: observe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVER_API_KEY: ${{ secrets[vars.OBSERVER_API_KEY_SECRET || (secrets.OPENAI_API_KEY != '' && 'OPENAI_API_KEY' || 'OBSERVER_API_KEY')] }}
          OBSERVER_KEY_SOURCE: ${{ vars.OBSERVER_API_KEY_SECRET != '' && (vars.OBSERVER_API_KEY_SECRET == 'OPENAI_API_KEY' && 'OPENAI_API_KEY' || vars.OBSERVER_API_KEY_SECRET == 'OBSERVER_API_KEY' && 'OBSERVER_API_KEY' || 'custom-secret') || (secrets.OPENAI_API_KEY != '' && 'OPENAI_API_KEY' || 'OBSERVER_API_KEY') }}
          OBSERVER_OPENAI_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
          OBSERVER_COMPAT_KEY_CONFIGURED: ${{ secrets.OBSERVER_API_KEY != '' }}
          OBSERVER_ENGINE: ${{ vars.OBSERVER_ENGINE }}
          OBSERVER_MODEL: ${{ vars.OBSERVER_MODEL }}
          OBSERVER_BASE_URL: ${{ vars.OBSERVER_BASE_URL }}
          OBSERVER_PROTOCOL: ${{ vars.OBSERVER_PROTOCOL }}
          OBSERVER_REANALYZE: ${{ github.event_name == 'workflow_dispatch' && inputs.reanalyze == true }}
          OBSERVER_PI_PACKAGE_ROOT: ${{ runner.temp }}/observer-pi/node_modules/@earendil-works/pi-ai
        run: node scripts/observer/observer.ts
      - name: Preserve evidence and state before notification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observer-state
          path: artifacts/observer/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish concise observation
        if: always()
        run: |
          if [ -f artifacts/observer/summary.md ]; then
            cat artifacts/observer/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Notify through existing Actions failure notifications
        if: steps.observe.outcome == 'failure'
        run: exit 1
