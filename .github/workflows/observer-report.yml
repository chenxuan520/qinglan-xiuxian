name: Publish observer report

on:
  workflow_run:
    workflows: ['Runtime observer']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-report:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}monitor/
    steps:
      - name: Select latest deployed game
        id: game
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          game_sha=$(gh run list --repo "$REPOSITORY" --workflow pages.yml --branch master --status success --limit 1 --json headSha --jq '.[0].headSha')
          test -n "$game_sha"
          echo "sha=$game_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.game.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build deployed game
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "$BASE_PATH/"
      - name: Check complete production build size
        run: node --experimental-strip-types scripts/size-check.ts --dir dist
      # 只在游戏构建完成后取当前可信发布工具，避免把未部署游戏带入站点。
      - name: Get current report tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: artifacts/report-tools
      - name: Preserve latest balance report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types artifacts/report-tools/scripts/restore-balance-report.ts
      - name: Preserve latest performance summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types artifacts/report-tools/scripts/restore-monitor-performance.ts
      - name: Preserve latest weapon report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types artifacts/report-tools/scripts/restore-weapon-report.ts
      - name: Preserve latest autoplay comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types artifacts/report-tools/scripts/restore-autoplay-report.ts
      - name: Preserve latest observer report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types artifacts/report-tools/scripts/restore-observer-report.ts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
