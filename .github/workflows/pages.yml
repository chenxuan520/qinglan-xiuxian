name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url || steps.deployment-retry-2.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 拉取完整历史与标签，供构建时注入 git describe 版本号
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "$BASE_PATH/"
      - name: Check complete production build size
        run: node --experimental-strip-types scripts/build/size-check.ts --dir dist
      - name: Keep latest daily report alongside the game
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/balance/restore-balance-report.ts
      - name: Publish latest performance summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/perf/restore-monitor-performance.ts
      - name: Keep latest weapon evaluation report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/weapon-benchmark/restore-weapon-report.ts
      - name: Keep latest autoplay comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/perf/restore-autoplay-report.ts
      - name: Preserve latest observer report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/observer/restore-observer-report.ts
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          err=""
          for attempt in $(seq 1 24); do
            visible=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/tmp/gh-pages-visibility.err || echo 0)
            if [ "$visible" -ge 1 ]; then exit 0; fi
            err=$(cat /tmp/gh-pages-visibility.err 2>/dev/null || true)
            sleep 5
          done
          echo "github-pages artifact not visible after 120 seconds" >&2
          [ -z "$err" ] || echo "$err" >&2
          exit 1
      # GitHub Pages 的产物元数据偶发瞬时失败，间隔重试两次再判定失败。
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry deploy after transient failure
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Wait before retrying deploy again
        if: steps.deployment-retry.outcome == 'failure'
        run: sleep 30
      - name: Retry deploy again after transient failure
        id: deployment-retry-2
        if: steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
