name: Deploy NPC AI Worker

# 共用 src/ 也可能改变对白、评语或统计协议，使用保守的触发范围避免漏部署。
on:
  push:
    branches: [master]
    paths:
      - 'workers/npc-ai/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/npc-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npc-ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6dfe244c6d35a2d3ed3ae6488bf64cfc
    steps:
      - name: Require deployment token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::未配置 CLOUDFLARE_API_TOKEN，无法部署 NPC Worker。"
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and deploy Worker
        run: npm run deploy:npc-ai
