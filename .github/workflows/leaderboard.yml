name: Deploy leaderboard Worker

# 推送 master 后自动部署万魂幡排行榜 Worker（qinglan-leaderboard）：先应用 D1 迁移（已应用的会跳过），再发布 Worker。
# Worker 引用了 src/ 下的道果与事实校验代码，所以每次推送都部署，保证前后端规则一致。
# 需要仓库 Secret：CLOUDFLARE_API_TOKEN，须含 Workers 脚本编辑与 D1 编辑权限。未配置时整个任务跳过，不报错。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6dfe244c6d35a2d3ed3ae6488bf64cfc
    steps:
      - name: Skip when token is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "未配置 CLOUDFLARE_API_TOKEN，跳过排行榜 Worker 部署。"
      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply qinglan-leaderboard --remote --config workers/leaderboard/wrangler.jsonc
      - name: Type-check and deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy:leaderboard
