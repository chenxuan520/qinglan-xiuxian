name: Deploy to Cloudflare

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check deployment credentials
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloudflare auto-deployment is inactive. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions Secrets.'
          fi

  deploy:
    needs: credentials
    if: needs.credentials.outputs.configured == 'true' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'cloudflare-production' || 'cloudflare-preview' }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and build
        run: |
          npm run format:check
          npm test
          npm run check:npc-ai
          npm run build:cloudflare
      - name: Deploy production Worker
        if: github.ref_name == 'master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --config workers/npc-ai/wrangler.jsonc --keep-vars
      - name: Deploy Pages
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          CF_BRANCH: ${{ github.ref_name }}
        run: |
          log_file="$RUNNER_TEMP/cloudflare-deploy.log"
          npx --no-install wrangler pages deploy artifacts/cloudflare --project-name qinglan-xiuxian --branch "$CF_BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=false | tee "$log_file"
          deployment_url=$(node -e 'const fs = require("node:fs"); const urls = fs.readFileSync(process.argv[1], "utf8").match(/https:\/\/[a-zA-Z0-9.-]+\.pages\.dev\b/g) || []; if (!urls.length) throw new Error("Deployment URL missing from Wrangler output"); console.log(urls.at(-1));' "$log_file")
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Cloudflare deployment: %s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
