name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check project
        run: |
          npm run format:check
          npm test
          npm run check:npc-ai
      - name: Build offline package
        run: npm run build -- --outDir artifacts/release/qinglan-xiuxian --emptyOutDir
      - name: Package release
        working-directory: artifacts/release
        run: zip -q -r "../qinglan-xiuxian-${{ github.ref_name }}-offline.zip" qinglan-xiuxian
      - name: Create checksum
        working-directory: artifacts
        run: sha256sum "qinglan-xiuxian-${{ github.ref_name }}-offline.zip" > "qinglan-xiuxian-${{ github.ref_name }}-offline.zip.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "artifacts/qinglan-xiuxian-${{ github.ref_name }}-offline.zip#Offline web package" \
            "artifacts/qinglan-xiuxian-${{ github.ref_name }}-offline.zip.sha256#SHA-256 checksum" \
            --verify-tag \
            --generate-notes \
            --title "叩仙门：青岚纪 ${{ github.ref_name }}"
