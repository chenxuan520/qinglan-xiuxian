name: Quality gates

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  documentation:
    name: Gameplay documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:check

  static:
    name: Formatting and Worker types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:npc-ai
      - run: npm run check:house-ads
      - run: npm run check:leaderboard

  interface:
    name: Desktop and mobile interfaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_PATH: /${{ github.event.repository.name }}
      UI_BASE_URL: http://localhost:5173/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build production site for browser checks
        run: npm run build -- --base "$BASE_PATH/"
      - name: Check complete production build size
        run: node --experimental-strip-types scripts/size-check.ts --dir dist
      - name: Install isolated browser regression tools
        run: npm ci --prefix scripts/browser-tools
      - name: Check desktop and mobile interfaces
        run: |
          npm run preview -- --base "$BASE_PATH/" --port 5173 --strictPort > "$RUNNER_TEMP/qinglan-ui-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$UI_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          npm run ui:check
      - name: Preserve UI regression result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-regression
          path: artifacts/ui-regression/
          if-no-files-found: ignore
          retention-days: 7

  standalone:
    name: Standalone build contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:standalone -- --outDir artifacts/standalone --emptyOutDir
      - run: node --experimental-strip-types scripts/size-check.ts --dir artifacts/standalone
      - run: node --experimental-strip-types scripts/standalone-check.ts artifacts/standalone
